[package]
name = "graphs-dot-parser"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "DOT parser implementation."
documentation = "https://docs.rs/graphs-dot-parser"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["graph", "dot"]

[dependencies.non-empty-slice]
workspace = true
features = ["ownership", "alloc"]

[dependencies.ownership]
workspace = true
features = ["derive"]

[dependencies.proc-macro2]
workspace = true
optional = true

[dependencies.quote]
workspace = true
optional = true

[dependencies.syn]
workspace = true
optional = true

[dependencies.pest]
workspace = true

[dependencies.pest_derive]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.trait-aliases]
workspace = true

[dependencies.graphs-core]
workspace = true

[features]
default = ["std"]
std = ["non-empty-slice/std", "ownership/std", "pest/std", "pest_derive/std"]
proc-macro = ["proc-macro2", "quote", "syn"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
